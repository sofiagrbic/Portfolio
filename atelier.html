<html lang="en">

    <title>Original Works | Sofia Grbic</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,400;1,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #fdfcf0; --pink: #dfb4c6; --sage: #8a8c2b; --dark: #4e5f3b; --text: #1a1a1a; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 100px; }
        
        /* Unified Navigation */
        nav { padding: 20px; display: flex; justify-content: center; gap: 25px; background: var(--sage); position: sticky; top: 0; z-index: 10000; flex-wrap: wrap; }
        nav a { text-decoration: none; color: white; font-size: 0.75rem; letter-spacing: 2px; font-weight: 600; text-transform: uppercase; transition: 0.3s; }
        nav a:hover { opacity: 0.7; font-style: italic; }

        .container { max-width: 1200px; margin: 80px auto; padding: 0 40px; }
        h1 { font-family: 'Bodoni Moda'; font-style: italic; font-size: clamp(3rem, 8vw, 5rem); text-align: center; margin-bottom: 80px; color: var(--sage); }

        .scrapbook { column-count: 3; column-gap: 40px; }

        .item { 
            display: inline-block; width: 100%; margin-bottom: 60px; 
            background: white; padding: 15px; box-shadow: 10px 15px 40px rgba(0,0,0,0.05); 
            position: relative; transition: 0.4s; 
        }
        .item:hover { transform: scale(1.03) rotate(0deg); z-index: 5; }
