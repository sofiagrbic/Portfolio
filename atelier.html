<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier | Sofia Grbic</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #fcfcfc; --primary-gray: #2d2d2d; --baby-pink: #f9ecec; --transition: all 0.6s cubic-bezier(0.2, 1, 0.3, 1); }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--primary-gray); }
        nav { padding: 30px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(252, 252, 252, 0.9); z-index: 1000; border-bottom: 1px solid #f0f0f0; }
        nav a { text-decoration: none; color: var(--primary-gray); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 2px; margin-left: 30px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 80px 40px; }
        h1 { font-family: 'Playfair Display'; font-style: italic; font-size: 3.5rem; text-align: center; margin-bottom: 50px; }
        
        .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .gallery-item { aspect-ratio: 1 / 1; overflow: hidden; background: #eee; position: relative; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: var(--transition); }
        .gallery-item:hover img { transform: scale(1.08); }

        @media (max-width: 768px) { .gallery { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <nav>
        <div style="font-weight: 600; letter-spacing: 2px;">SG</div>
        <div>
            <a href="index.html">Home</a>
            <a href="work.html">Work</a>
            <a href="atelier.html">Atelier</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <div class="container">
        <h1>The Atelier</h1>
        <div class="gallery">
            <div class="gallery-item"><img src="art1.jpg"></div>
            <div class="gallery-item"><img src="art2.jpg"></div>
            <div class="gallery-item"><img src="art3.jpg"></div>
            <div class="gallery-item"><img src="art4.jpg"></div>
            <div class="gallery-item"><img src="art5.jpg"></div>
            <div class="gallery-item"><img src="art6.jpg"></div>
            <div class="gallery-item"><img src="art7.jpg"></div>
            <div class="gallery-item"><img src="art8.jpg"></div>
            <div class="gallery-item"><img src="art9.jpg"></div>
        </div>
    </div>
</body>
</html>
