<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier | Sofia Grbic</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #fcfcfc; --gray: #2d2d2d; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--gray); }
        nav { padding: 30px 40px; display: flex; justify-content: space-between; align-items: center; background: white; border-bottom: 1px solid #eee; }
        nav a { text-decoration: none; color: var(--gray); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 2px; margin-left: 30px; }
        .container { max-width: 1100px; margin: 0 auto; padding: 80px 40px; }
        h1 { font-family: 'Playfair Display'; font-style: italic; font-size: 3.5rem; text-align: center; margin-bottom: 50px; }
        .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .item { aspect-ratio: 1/1; overflow: hidden; background: #eee; }
        .item img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
        .item:hover img { transform: scale(1.1); }
        @media (max-width: 768px) { .gallery { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <nav>
        <div style="font-weight: 600; letter-spacing: 2px;">SG</div>
        <div><a href="index.html">Home</a><a href="work.html">Work</a><a href="atelier.html">Atelier</a><a href="contact.html">Contact</a></div>
    </nav>
    <div class="container">
        <h1>The Atelier</h1>
        <div class="gallery">

            <div class="item"><img src="art7.jpg"></div><div class="item"><img src="art8.jpg"></div><div class="item"><img src="art9.jpg"></div>
        </div>
    </div>
</body>
</html>
