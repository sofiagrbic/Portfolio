<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sofia Grbic | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #fcfcfc; --gray: #2d2d2d; --pink: #f9ecec; --green: #e9f0eb; --trans: all 0.6s cubic-bezier(0.2, 1, 0.3, 1); }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--gray); overflow-x: hidden; }
        nav { padding: 30px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(252, 252, 252, 0.9); z-index: 1000; border-bottom: 1px solid #eee; }
        nav a { text-decoration: none; color: var(--gray); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 2px; margin-left: 30px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 40px; text-align: center; }
        .hero { padding: 150px 0; }
        .hero-title { font-family: 'Playfair Display'; font-size: clamp(4rem, 12vw, 10rem); font-style: italic; cursor: pointer; transition: var(--trans); letter-spacing: -2px; margin: 0; }
        .hero-title:hover { letter-spacing: 5px; text-shadow: 3px 3px 0px var(--pink); }
        .subtitle { letter-spacing: 5px; text-transform: uppercase; font-size: 0.8rem; opacity: 0.6; margin-top: 20px; }
    </style>
</head>
<body>
    <nav>
        <div style="font-weight: 600; letter-spacing: 2px;">SG</div>
        <div>
            <a href="index.html">Home</a>

    </header>
</body>
</html>
